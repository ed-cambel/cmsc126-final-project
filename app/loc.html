<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Center Map on User Location</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; }
    #map {
      height: 100vh;
      width: 100%;
    }
    #locate-btn {
      position: absolute;
      top: 20px;
      left: 50px;
      z-index: 1000;
      background-color: white;
      border: 2px solid #333;
      border-radius: 5px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #locate-btn:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <button id="locate-btn">📍 My Location</button>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([0, 0], 2);

    // FIXED: Clean Tile Layer URL
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let userMarker;

    function centerOnUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            map.setView([lat, lng], 15);

            if (userMarker) {
              userMarker.setLatLng([lat, lng]);
            } else {
              userMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup('You are here')
                .openPopup();
            }
          },
          () => {
            alert("Could not get your location. Please ensure location services are on.");
          }
        );
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }

    document.getElementById('locate-btn').addEventListener('click', centerOnUser);
  </script>
</body>
</html>
